<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var name="window";
        function Person(name){
            this.name=name;
            //普通函数
            this.foo1=function(){
                console.log(this.name);
            }
            //箭头函数
            this.foo2=()=>console.log(this.name);
            //返回普通函数的函数
            this.foo3=function(){
                return function(){
                    console.log(this.name);
                }
            }
            //返回箭头函数的函数
            this.foo4=function(){
                return ()=>{
                    console.log(this.name);
                }
            }

        }
        //创建两个person对象
        var person1=new Person("张三");
        var person2=new Person("李四");
        //调用普通函数
        person1.foo1(); //张三
        //普通函数使用call改变this指向
        person1.foo1.call(person2); //李四

        //调用箭头函数
        person1.foo2(); //张三
        //箭头函数使用call改变this指向
        person1.foo2.call(person2); //张三,箭头函数的this指向创建时所在的对象,无法被改变

        //调用返回普通函数的函数
        person1.foo3()();//直接调用普通函数（没有对象前缀），this 指向全局对象（window）
        //调用返回普通函数的函数,并使用call改变this指向
        person1.foo3.call(person2)();//foo3 内部的 this = person2,直接调用普通函数（没有对象前缀）,默认绑定规则：this 指向 window
        person1.foo3().call(person2); //foo3 内部的 this = person1,使用 call 显式绑定 this 到 person2,输出：person2.name = 'person2'

        //调用返回箭头函数的函数
        person1.foo4()();//foo4 内部的 this = person1,箭头函数的 this 在定义时已确定（继承 foo4 的 this = person1）,无法改变，输出：person1.name = 'person1'
        //调用返回箭头函数的函数,并使用call改变this指向
        person1.foo4.call(person2)();//foo4 内部的 this = person2,箭头函数的 this 在定义时已确定（继承 foo4 的 this = person2）,无法改变，输出：person2.name = 'person2'
        person1.foo4().call(person2);//foo4 内部的 this = person1,使用 call 显式绑定 this 到 person2,箭头函数的 this 在定义时已确定（继承 foo4 的 this = person1）,无法改变，输出：person1.name = 'person1'

    </script>
</body>
</html>
