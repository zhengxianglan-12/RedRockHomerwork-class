<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lv2</title>
</head>
<body>
    <div>
        <b>请选择您的爱好</b>
        <br/>
    </div>
    <div id="divlist">
        <input type="checkbox" value="内卷">内卷
        <input type="checkbox" value="疯狂内卷">疯狂内卷
        <input type="checkbox" value="拼命内卷">拼命内卷
        <input type="checkbox" value="使劲内卷">使劲内卷
        <br />
        <input type="button" value="全选" onclick="selectall()">
        <input type="button" value="全不选" onclick="noselectall()">
        <input type="button" value="反选" onclick="reverseall()">

    </div>
    <script>
        const checkboxs=document.querySelectorAll('input[type="checkbox"]');
        function selectall(){
            checkboxs.forEach(checkbox => checkbox.checked = true);
        }
        function noselectall(){
            checkboxs.forEach(checkbox=>checkbox.checked=false);
        }
        function reverseall(){
            checkboxs.forEach(checkbox=>checkbox.checked=!checkbox.checked);
        }
        
    </script>
</body>
</html>
