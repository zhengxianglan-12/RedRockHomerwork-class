<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body{
            background-color: #fff;
            color: #333;
            display: flex;
            flex-direction: column;
        }


        .nav-top{
            display: flex;
            justify-content: flex-end;
            padding: 20px 30px 0;
        }
        .nav-top a{
            text-decoration: none;
            color: #333;
            font-size: 13px;
            margin-left: 20px;
            font-weight: bold;
        }
        .top-1{
            background-color: #64bbf1;
        }

        .main-content{
            display: flex;
            flex-direction: column;
            align-items: center;/*子元素水平居中*/
            margin-top: 100px;
        }
        .logo{
            margin-bottom: 30px;
        }
        .logo-text{
            font-size: 48px;
            font-weight: bold;
            letter-spacing: -5px;
        }
        .logo-blue{
            color: #281edd;
        }
        .logo-red{
            color: #e10803;
        }

        .search-box{
            width: 600px;
            position: relative;/* 为按钮定位提供参考 */
            margin-bottom: 30px;
        }
        .search-input{
            width: 100%;
            height: 44px;
            border: 2px solid #d5d5d5;
            padding: 0 16px;

        }
        .search-btn{
            position: absolute;/*绝对定位*/
            right: 0;
            top: 0;
            height: 44px;
            width: 108px;
            background-color: #3388ff;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        .qrcode{
            width: 100px;
            height: 100px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            background-image: url('img/qr.jpg');
            background-size: contain;
        }
        .app-text1{
            margin-left: 10px;
            font-size: 14px;
            color: #494949;
        }
         .app-text2{
            margin-left: 10px;
            font-size: 14px;
            color: #bababa;
            margin-bottom: 40px;
        }
        .app-promo{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 120px;
        }
        .footer{
            text-align: center;
            padding: 20px 0;
            font-size: 12px;
            color: #bababa;
        }
        .footer-links{
            margin-bottom: 10px;
        }
        .footer-links a{
            color: #bababa;
            text-decoration: none;
            margin: 0 10px;
        }





    </style>
</head>
<body>

    <div class="nav-top">
        <a href="#">新闻</a>
        <a href="#">hao123</a>
        <a href="#">地图</a>
        <a href="#">视频</a>
        <a href="#">贴吧</a>
        <a href="#">学术</a>
        <a href="#">登录</a>
        <a href="#">设置</a>
        <a href="#" class="top-1">更多产品</a>
    </div>

    <div class="main-content">
        <div class="logo">
            <span class="logo-text">
                <span class="logo-blue">Bai</span>
                <span class="logo-blue">du</span>
                <span class="logo-red">百度</span>

            </span>
        </div>
        <div class="search-box">
            <input type="text" class="search-input">
            <button class="search-btn">百度一下</button>
        </div>
        <div class="app-promo">
            <div class="qrcode"></div>
            <div class="app-text1">下载百度APP</div>
            <div class="app-text2">有事搜一搜，没事看一看</div>
        </div>
        <div class="footer">
            <div class="footer-links">
                <a href="#">把百度作为首页</a>
                <a href="#">关于百度</a>
                <a href="#">About Baidu</a>
                <a href="#">百度推广</a>
            </div>
            <div>©2019 Baidu 使用百度前必读 意见反馈 证号KC制作</div>
        </div>
    </div>
</body>
</html>
