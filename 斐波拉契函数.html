<!DOCTYPE html>

</head>
<body>
    <script>
        //递归函数
        function factorial(n){
            if(n==1){return 1;}
            return n*factorial(n-1);
        }
        console.log(factorial(4));
        //循环
        function factorial2(n){
            let result=1;
            for(let i=1;i<=n;i++){}
            result*=i;
            return result;
        }
        console.log(factorial(4));
    </script>
</body>
</html>
