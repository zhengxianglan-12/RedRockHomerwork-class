<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-size: Arial, sans-serif;
            padding: 20px;
        }
        .container{
            max-width: 600px;
            margin: auto;
        }
        input, button{
            padding: 10px;
            margin: 5px 0;
            font-size: 16px;
        }
        #result{
            margin-top: 20px;
            padding: 15px;
            background: #fef3c7;
            border-radius: 5px;
        }
    </style>

</head>
<body>
    <div class="container">
        <h1>LV0:获取Github用户信息</h1>
        <input type="text" id="username" placeholder="输入Github用户名" value="zhengxianglan-12">
        <button onclick="getUserInfo()">获取用户信息</button>
        <div id="result"></div>
    </div>
    <script>
        async function getUserInfo(){
        const username=document.getElementById('username').value;
        const resultDiv=document.getElementById('result');
        if(!username){
            resultDiv.innerHTML='<p style="color:red;">请输入有效的Github用户名。</p>';
            return;
        }
        resultDiv.innerHTML='<p>正在获取用户信息...</p>';
        try{
            const response=await fetch(`https://api.github.com/users/${username}`);

            if(!response.ok){
                throw new Error(`网络请求失败：${response.status}`);
            }
            const data=await response.json();
            resultDiv.innerHTML=`<h3>用户信息:</h3>
                    <p><strong>用户名:</strong> ${data.login}</p>
                    <p><strong>昵称:</strong> ${data.name || '未设置'}</p>
                    <p><strong>粉丝数:</strong> ${data.followers}</p>
                    <p><strong>仓库数:</strong> ${data.public_repos}</p>
                    <p><strong>个人主页:</strong> <a href="${data.html_url}" target="_blank">${data.html_url}</a></p>
                    <p><strong>头像:</strong><br><img src="${data.avatar_url}" width="100" style="border-radius: 50%;"></p>
                `;
        }catch(error){
            resultDiv.innerHTML = `<p style="color: red;">错误: ${error.message}</p>`;
            console.error('获取用户信息时出错：',error);
        }
    }
    </script>
</body>
</html>
