<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 500px;
            padding: 10px;
            border: 1px solid black;
        }
        a{
            text-decoration: none;
            color:#2a55b1;
            
        }
        p{
            color: #e23822;
        }
        .box1{
            background-color: #f0f0f0;
            

        }
        .box1:hover{
            background-color: yellow;
            font-size: 0.9em;
            transition: all 0.5s ease-in-out;
        }
        li:nth-child(1){
            font-size: 20px;
            color: black;
            margin: 5px 0;
        }
        li:nth-child(2){
            font-size: 30px;
            color: black;
            margin: 5px 0;
        }
        li:nth-child(3){
            font-size: 40px;
            color: black;
            margin: 5px 0;
        }






    </style>
</head>
<body>
   <div class="box">
    <a href="#">我不想要a标签默认的下划线</a>
    <p>我的字体颜色是红色</p>
    <div class="box1">
        鼠标悬停在我的上面时，我的背景颜色变成黄色，并且字体变小
    </div>
    <ul>
        <li>我的字体大小是20px</li>
        <li>我的字体大小是30px</li>
        <li>我的字体大小是40px</li>
    </ul>
    <p>我的字体颜色是红色</p>

   </div> 
</body>
</html>
