<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     body {
            
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); /* 背景使用135度角渐变，从紫色到蓝色 */
            display: flex;           /* 使用Flex布局 */
            justify-content: center;  /* 水平居中子元素 */
            align-items: center;     /* 垂直居中子元素 */
            min-height: 100vh;
        }
    .card-container{
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }
    .card{
        width: 320px;
        background-color: white;
        border-radius: 15px;
        transition: all 0.4s;
    }
    .card:hover{
        transform: translateY(-15px) scale(1.1);
        box-shadow: 0 20px 40px rgba(0, 0,0,0.2);
    }
    .card-image{
        height: 200px;

    }
    .card-image img{
        width: 100%;
        height: 100%;
        transition: transform 0.5s ease;
    }
    .card:hover .card-image img{
        transform: scale(1.03);
    }
    .card-content{
        padding: 25px;
    }
    .card-button{
        display: inline-block;
        padding: 10px 20px;
        background-color: #92b1e2;
        color: white;
        text-decoration: none;
        transition: all 0.3s ease;
    }
    .card-button:hover{
        transform: translateY(-5px);
    }



    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
        <div class="card-image">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" alt="山脉风景">

        </div>
        <div class="card-content">
            <h1>每日格言</h1>
            <p>每天都要好好吃饭</p>
            <a href="#" class="card-button">点我</a>
        </div>
    </div>

    </div>
    
</body>
</html>
