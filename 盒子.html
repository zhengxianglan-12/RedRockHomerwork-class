<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            color: white;
            background-color: rgb(249, 246, 242);
            overflow-x: auto;
        }
        .container{
            display: flex;
            align-items: center;
        }
        .box1{
            height: 500px;
            background-color: aqua;
            flex: 0 0 320px;
        }
        .box2{
            height: 300px;
            background-color: rgb(167, 230, 103);
            flex: 1 1 320px;
        }
        .box3{
            height: 100px;
            background-color: rgb(249, 230, 208);
            align-self: flex-start;
            flex: 1 1 320px;
        }
        .box4{
            height: 600px;
            background-color: rgb(179, 179, 237);
            flex: 0 3 320px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            一号盒子
            <p>我始终保持原大小，不缩放。</p>
        </div>
        <div class="box2">
            二号盒子
            <p>浏览器界面变宽时，我占满其他元素剩下的所有空间</p>
        </div>
        <div class="box3">
            三号盒子
            <p>我和四号盒子的顶部对齐</p>
        </div>
        <div class="box4">
            四号盒子
            <p>浏览器界面变窄时，我缩窄的速度要比二、三号盒子快</p>
        </div>
    </div>
</body>
</html>
